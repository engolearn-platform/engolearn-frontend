    "/topic-items/{itemId}/attempts": {
      "post": {
        "operationId": "startAttempt",
        "summary": "Start or resume learning/retry of one item",
        "description": "LEARN checks level/order, atomically pins release+item version and saves IN_PROGRESS at CONTEXT/0 before response. Existing running LEARN returns same attempt. RETRY requires completed item; creates ITEM retry session on latest version, unless resuming next pending item of an existing TOPIC retry session (use frozen version). Replacement of another running retry requires its observed ID; otherwise409 RETRY_CONFIRMATION_REQUIRED. LEARN sends replaceRetrySessionId:null. To continue a frozen TOPIC retry sequence, send its retrySessionId explicitly; otherwise null. LEARN sends both session fields null. Stale/mismatched session IDs are409 RETRY_SESSION_CHANGED; never abandon a different retry implicitly.",
        "x-backend-status": "new",
        "parameters": [
          {
            "name": "itemId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1
            }
          },
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128
            },
            "description": "One key per action; reuse the same key and identical body after an uncertain response. Scope to viewer + method + path."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/StartAttemptRequestDto"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Success envelope. Nullable fields are explicitly present.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "data",
                    "timestamp"
                  ],
                  "properties": {
                    "data": {
                      "$ref": "#/components/schemas/AttemptDto"
                    },
                    "timestamp": {
