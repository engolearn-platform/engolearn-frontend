name: EngoLearn Narrative

colors:
  surface: "#f7f9fb"
  surface-dim: "#d8dadc"
  surface-bright: "#f7f9fb"
  primary: "#006565"
  primary-container: "#008080"
  on-primary: "#ffffff"
  secondary: "#705d00"
  secondary-container: "#fcd400"
  tertiary: "#4d5a74"
  error: "#ba1a1a"
  learning-mint: "#ddf5f4" # Selected rows, dialogue emphasis, positive feedback
  learning-mint-border: "#b8dfdb"
  learning-note: "#fff0b8" # Existing learning tips and part-of-speech badges
  learning-note-ink: "#544600"
  learning-outline: "#e2e8ea" # Learning card and nested example borders
  learning-nav-active: "#f5fefe" # Actual active learning category
  learning-nav-border: "#c4dfdf" # Active category frame/dividers

typography:
  headline-lg:
    fontFamily: "Hanken Grotesk"
    fontSize: "28px"
    fontWeight: 700
    lineHeight: "36px"

  headline-md:
    fontFamily: "Hanken Grotesk"
    fontSize: "22px"
    fontWeight: 600
    lineHeight: "28px"

  body-md:
    fontFamily: "Hanken Grotesk"
    fontSize: "16px"
    fontWeight: 400
    lineHeight: "24px"

rounded:
  sm: "0.25rem"
  DEFAULT: "0.5rem"
  md: "0.75rem"
  lg: "1rem"
  xl: "1.5rem"
  full: "9999px"

spacing:
  margin-page: "1.25rem"
  gutter-card: "1rem"
  stack-sm: "0.5rem"
  stack-md: "1rem"
  stack-lg: "1.5rem"
